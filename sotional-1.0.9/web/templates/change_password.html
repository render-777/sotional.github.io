{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block subtitle %}로그인한 계정의 비밀번호를 직접 변경합니다.{% endblock %}
{% block content %}
<form method="post" class="form editor">
  <label>
    현재 비밀번호
    <input name="current_password" type="password" autocomplete="current-password" required>
  </label>
  <label>
    새 비밀번호
    <input name="new_password" type="password" autocomplete="new-password" required>
  </label>
  <label>
    새 비밀번호 확인
    <input name="confirm_password" type="password" autocomplete="new-password" required>
  </label>
  <div class="actions">
    <button class="button primary" type="submit">변경</button>
    <a class="button ghost" href="{{ url_for('dashboard') }}">취소</a>
  </div>
</form>
{% endblock %}
