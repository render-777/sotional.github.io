services:
  - type: web
    name: sotional
    runtime: docker
    plan: free
    rootDir: sotional-1.0.9/web
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: TZ
        value: Asia/Seoul
      - key: UPLOAD_FOLDER
        value: /app/static/uploads
      - key: MYSQL_DATABASE
        value: sotional
      - key: DB_HOST
        value: serverless-europe-west2.sysp0000.db2.skysql.com
      - key: DB_PORT
        value: 4001
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: DB_SSL_CA
        value: /etc/secrets/globalsignrootca.pem
      - key: STORAGE_BACKEND
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
