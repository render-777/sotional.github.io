{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block subtitle %}{{ post.username }} · {{ post.created_at }}{% endblock %}
{% block content %}
<article class="detail">
  {% if post.image_path %}
  <img class="detail-image" src="{{ url_for('static', filename=post.image_path) }}" alt="">
  {% endif %}
  <div class="detail-content">{{ post.content }}</div>
  <div class="actions">
    <a class="button ghost" href="{{ url_for('board', board=post.board, league_type=post.league_type) }}">목록</a>
    {% if can_manage_post(post) %}
    <a class="button primary" href="{{ url_for('edit_post', post_id=post.id) }}">수정</a>
    <form method="post" action="{{ url_for('delete_post', post_id=post.id) }}" onsubmit="return confirm('이 글을 삭제할까요?');">
      <button class="button danger" type="submit">삭제</button>
    </form>
    {% endif %}
  </div>
</article>
{% endblock %}
